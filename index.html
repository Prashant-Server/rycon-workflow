<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RSI — Precision Quality Machining</title>
<style>
:root{
  --primary:#1e3a5f;--primary-l:#2d5a8e;--primary-d:#152a47;
  --accent:#2563eb;--accent-l:#3b82f6;
  --success:#16a34a;--success-bg:#dcfce7;
  --warning:#d97706;--warning-bg:#fef3c7;
  --danger:#dc2626;--danger-bg:#fee2e2;
  --info:#0891b2;--info-bg:#e0f2fe;
  --purple:#7c3aed;--purple-bg:#ede9fe;
  --bg:#f1f5f9;--card:#fff;--border:#e2e8f0;
  --text:#1e293b;--text-s:#64748b;--text-m:#94a3b8;
  --sw:240px;--th:60px;
  --shadow:0 1px 3px rgba(0,0,0,.08),0 1px 2px rgba(0,0,0,.06);
  --shadow-md:0 4px 6px rgba(0,0,0,.07),0 2px 4px rgba(0,0,0,.06);
  --shadow-lg:0 10px 15px rgba(0,0,0,.1),0 4px 6px rgba(0,0,0,.05);
  --radius:8px;--radius-lg:12px;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI',system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--text);font-size:14px;line-height:1.5;overflow-x:hidden}
a{color:var(--accent);text-decoration:none}
button{cursor:pointer;border:none;outline:none;font-family:inherit;font-size:14px}
input,select,textarea{font-family:inherit;font-size:14px;outline:none}
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:#cbd5e1;border-radius:10px}

/* ── LOGIN ── */
#login-screen{position:fixed;inset:0;background:linear-gradient(135deg,var(--primary-d) 0%,var(--primary) 50%,var(--primary-l) 100%);display:flex;align-items:center;justify-content:center;z-index:1000}
.login-card{background:var(--card);border-radius:16px;padding:48px 40px;width:420px;max-width:95vw;box-shadow:var(--shadow-lg)}
.login-logo{text-align:center;margin-bottom:32px}
.login-logo .company-icon{width:64px;height:64px;background:linear-gradient(135deg,var(--primary),var(--accent));border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:28px;color:#fff;margin:0 auto 16px}
.login-logo h1{font-size:20px;font-weight:700;color:var(--primary);letter-spacing:.5px}
.login-logo p{font-size:12px;color:var(--text-s);margin-top:4px;letter-spacing:1px;text-transform:uppercase}
.login-divider{height:1px;background:var(--border);margin:24px 0}
.form-group{margin-bottom:20px}
.form-group label{display:block;font-size:12px;font-weight:600;color:var(--text-s);text-transform:uppercase;letter-spacing:.5px;margin-bottom:8px}
.form-group input{width:100%;padding:11px 14px;border:1.5px solid var(--border);border-radius:var(--radius);background:#f8fafc;transition:all .2s}
.form-group input:focus{border-color:var(--accent);background:#fff;box-shadow:0 0 0 3px rgba(37,99,235,.1)}
.btn-login{width:100%;padding:13px;background:linear-gradient(135deg,var(--primary),var(--accent));color:#fff;border-radius:var(--radius);font-size:15px;font-weight:600;letter-spacing:.5px;margin-top:8px;transition:all .2s}
.btn-login:hover{opacity:.9;transform:translateY(-1px);box-shadow:0 4px 12px rgba(37,99,235,.3)}
.login-hint{margin-top:20px;padding:14px;background:#f8fafc;border-radius:var(--radius);border:1px solid var(--border)}
.login-hint p{font-size:12px;color:var(--text-s);margin-bottom:6px;font-weight:600}
.login-hint span{display:block;font-size:11px;color:var(--text-m);margin-bottom:3px}

/* ── LAYOUT ── */
#app{display:none}
#app.active{display:flex;height:100vh;overflow:hidden}
#sidebar{width:var(--sw);background:var(--primary);color:#fff;display:flex;flex-direction:column;flex-shrink:0;transition:width .3s;overflow:hidden;z-index:100}
#sidebar.collapsed{width:60px}
.sidebar-header{padding:16px;display:flex;align-items:center;gap:10px;border-bottom:1px solid rgba(255,255,255,.1);min-height:var(--th)}
.sidebar-logo-icon{width:36px;height:36px;background:rgba(255,255,255,.15);border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
.sidebar-logo-text h2{font-size:13px;font-weight:700;white-space:nowrap;overflow:hidden}
.sidebar-logo-text p{font-size:10px;color:rgba(255,255,255,.6);white-space:nowrap}
.sidebar-nav{flex:1;overflow-y:auto;padding:8px 0}
.nav-section{padding:8px 12px 4px;font-size:10px;font-weight:700;color:rgba(255,255,255,.4);text-transform:uppercase;letter-spacing:1px;white-space:nowrap;overflow:hidden}
.nav-item{display:flex;align-items:center;gap:10px;padding:10px 14px;cursor:pointer;transition:all .2s;position:relative;white-space:nowrap;overflow:hidden}
.nav-item:hover{background:rgba(255,255,255,.1)}
.nav-item.active{background:rgba(255,255,255,.15);border-right:3px solid #fff}
.nav-item .nav-icon{font-size:17px;width:24px;text-align:center;flex-shrink:0}
.nav-item .nav-label{font-size:13px;font-weight:500}
.nav-item .nav-badge{margin-left:auto;background:var(--danger);color:#fff;font-size:10px;font-weight:700;padding:2px 6px;border-radius:10px;flex-shrink:0}
.sidebar-footer{padding:12px;border-top:1px solid rgba(255,255,255,.1)}
.sidebar-user{display:flex;align-items:center;gap:10px;padding:8px;border-radius:var(--radius);cursor:pointer;transition:all .2s}
.sidebar-user:hover{background:rgba(255,255,255,.1)}
.user-avatar{width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,#3b82f6,#8b5cf6);display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;color:#fff;flex-shrink:0}
.user-info p{font-size:13px;font-weight:600;white-space:nowrap}
.user-info span{font-size:11px;color:rgba(255,255,255,.6)}

/* ── MAIN ── */
#main{flex:1;display:flex;flex-direction:column;overflow:hidden}
#topbar{height:var(--th);background:var(--card);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 20px;gap:16px;flex-shrink:0;box-shadow:var(--shadow)}
.topbar-left{display:flex;align-items:center;gap:12px}
.btn-toggle-sidebar{background:none;padding:8px;border-radius:var(--radius);color:var(--text-s);font-size:18px;transition:all .2s}
.btn-toggle-sidebar:hover{background:var(--bg);color:var(--text)}
.page-title{font-size:18px;font-weight:700;color:var(--text)}
.page-subtitle{font-size:12px;color:var(--text-s)}
.topbar-right{margin-left:auto;display:flex;align-items:center;gap:12px}
.search-box{position:relative;display:flex;align-items:center}
.search-box input{padding:8px 14px 8px 36px;border:1.5px solid var(--border);border-radius:20px;background:#f8fafc;width:220px;transition:all .2s}
.search-box input:focus{border-color:var(--accent);background:#fff;width:280px}
.search-box .search-icon{position:absolute;left:11px;color:var(--text-m);font-size:15px}
.btn-notif{background:none;padding:8px;border-radius:var(--radius);color:var(--text-s);font-size:18px;position:relative;transition:all .2s}
.btn-notif:hover{background:var(--bg);color:var(--text)}
.notif-dot{position:absolute;top:6px;right:6px;width:8px;height:8px;background:var(--danger);border-radius:50%;border:2px solid #fff}
.notif-count{position:absolute;top:4px;right:4px;background:var(--danger);color:#fff;font-size:10px;font-weight:700;padding:1px 4px;border-radius:8px;min-width:16px;text-align:center;line-height:14px}
.topbar-divider{height:28px;width:1px;background:var(--border)}
.topbar-user{display:flex;align-items:center;gap:8px;cursor:pointer;padding:6px 10px;border-radius:var(--radius);transition:all .2s}
.topbar-user:hover{background:var(--bg)}
.topbar-user .ta{width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,var(--primary),var(--accent));display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:#fff}
.topbar-user .tu-info p{font-size:13px;font-weight:600}
.topbar-user .tu-info span{font-size:11px;color:var(--text-s)}

/* ── CONTENT ── */
#page-content{flex:1;overflow-y:auto;padding:24px}

/* ── CARDS ── */
.card{background:var(--card);border-radius:var(--radius-lg);padding:20px;box-shadow:var(--shadow)}
.card-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.card-title{font-size:15px;font-weight:700;color:var(--text)}
.card-subtitle{font-size:12px;color:var(--text-s);margin-top:2px}

/* ── STAT CARDS ── */
.stats-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:16px;margin-bottom:24px}
.stat-card{background:var(--card);border-radius:var(--radius-lg);padding:16px 18px;box-shadow:var(--shadow);border-left:4px solid transparent;cursor:pointer;transition:all .2s}
.stat-card:hover{transform:translateY(-2px);box-shadow:var(--shadow-md)}
.stat-card.blue{border-color:var(--accent)}
.stat-card.green{border-color:var(--success)}
.stat-card.orange{border-color:var(--warning)}
.stat-card.red{border-color:var(--danger)}
.stat-card.purple{border-color:var(--purple)}
.stat-card.cyan{border-color:var(--info)}
.stat-card .s-icon{font-size:24px;margin-bottom:8px}
.stat-card .s-val{font-size:28px;font-weight:800;color:var(--text);line-height:1}
.stat-card .s-label{font-size:12px;color:var(--text-s);margin-top:4px;font-weight:500}
.stat-card .s-sub{font-size:11px;color:var(--text-m);margin-top:2px}

/* ── BUTTONS ── */
.btn{padding:8px 16px;border-radius:var(--radius);font-weight:600;font-size:13px;transition:all .2s;display:inline-flex;align-items:center;gap:6px}
.btn-primary{background:var(--accent);color:#fff}
.btn-primary:hover{background:var(--accent-l);box-shadow:0 4px 12px rgba(37,99,235,.3)}
.btn-success{background:var(--success);color:#fff}
.btn-success:hover{opacity:.9}
.btn-warning{background:var(--warning);color:#fff}
.btn-warning:hover{opacity:.9}
.btn-danger{background:var(--danger);color:#fff}
.btn-danger:hover{opacity:.9}
.btn-outline{background:none;border:1.5px solid var(--border);color:var(--text-s)}
.btn-outline:hover{border-color:var(--accent);color:var(--accent);background:#f0f7ff}
.btn-ghost{background:none;color:var(--text-s)}
.btn-ghost:hover{background:var(--bg);color:var(--text)}
.btn-sm{padding:5px 12px;font-size:12px}
.btn-lg{padding:12px 24px;font-size:15px;font-weight:700}
.btn-xl{padding:16px 32px;font-size:16px;font-weight:700;width:100%;justify-content:center}

/* ── BADGES ── */
.badge{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.5px}
.badge-success{background:var(--success-bg);color:var(--success)}
.badge-warning{background:var(--warning-bg);color:#92400e}
.badge-danger{background:var(--danger-bg);color:var(--danger)}
.badge-info{background:var(--info-bg);color:var(--info)}
.badge-primary{background:#dbeafe;color:#1d4ed8}
.badge-purple{background:var(--purple-bg);color:var(--purple)}
.badge-gray{background:#f1f5f9;color:var(--text-s)}
.badge-dark{background:var(--primary);color:#fff}

/* ── PRIORITY ── */
.priority-urgent{color:var(--danger);font-weight:700}
.priority-high{color:var(--warning);font-weight:700}
.priority-normal{color:var(--accent);font-weight:600}
.priority-low{color:var(--text-m)}

/* ── PROGRESS ── */
.progress-wrap{margin:8px 0}
.progress-bar{height:8px;background:#e2e8f0;border-radius:10px;overflow:hidden}
.progress-fill{height:100%;border-radius:10px;transition:width .5s ease}
.progress-fill.green{background:linear-gradient(90deg,#16a34a,#22c55e)}
.progress-fill.blue{background:linear-gradient(90deg,var(--accent),#60a5fa)}
.progress-fill.orange{background:linear-gradient(90deg,var(--warning),#fbbf24)}
.progress-fill.red{background:linear-gradient(90deg,var(--danger),#f87171)}
.progress-meta{display:flex;justify-content:space-between;align-items:center;margin-top:4px;font-size:12px;color:var(--text-s)}
.progress-meta strong{color:var(--text);font-weight:700}

/* ── ORDER CARDS ── */
.orders-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:16px}
.order-card{background:var(--card);border-radius:var(--radius-lg);padding:18px;box-shadow:var(--shadow);border:1px solid var(--border);cursor:pointer;transition:all .2s;position:relative;overflow:hidden}
.order-card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--accent),var(--accent-l))}
.order-card.delayed::before{background:linear-gradient(90deg,var(--danger),#f87171)}
.order-card.completed::before{background:linear-gradient(90deg,var(--success),#22c55e)}
.order-card:hover{transform:translateY(-2px);box-shadow:var(--shadow-md);border-color:var(--accent-l)}
.order-card .oc-header{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:10px}
.order-card .oc-number{font-size:14px;font-weight:800;color:var(--primary)}
.order-card .oc-customer{font-size:13px;font-weight:600;color:var(--text);margin-top:2px}
.order-card .oc-job{font-size:12px;color:var(--text-s);margin-top:1px}
.order-card .oc-qty{margin:12px 0;padding:10px;background:var(--bg);border-radius:var(--radius)}
.qty-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px}
.qty-item{text-align:center}
.qty-item .qv{font-size:18px;font-weight:800}
.qty-item .ql{font-size:11px;color:var(--text-s)}
.qty-item.completed .qv{color:var(--success)}
.qty-item.remaining .qv{color:var(--warning)}
.qty-item.total .qv{color:var(--text)}
.qty-divider{width:1px;height:40px;background:var(--border)}
.order-card .oc-footer{display:flex;align-items:center;justify-content:space-between;margin-top:12px;padding-top:12px;border-top:1px solid var(--border)}
.oc-stage{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:600}
.oc-assigned{font-size:12px;color:var(--text-s);display:flex;align-items:center;gap:4px}

/* ── TABLES ── */
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse}
thead th{padding:10px 14px;background:#f8fafc;font-size:12px;font-weight:700;color:var(--text-s);text-transform:uppercase;letter-spacing:.5px;text-align:left;border-bottom:2px solid var(--border);white-space:nowrap}
tbody td{padding:12px 14px;border-bottom:1px solid var(--border);font-size:13px;vertical-align:middle}
tbody tr{transition:background .15s}
tbody tr:hover{background:#f8fafc}
tbody tr:last-child td{border-bottom:none}
.td-order{font-weight:700;color:var(--primary)}
.td-link{color:var(--accent);cursor:pointer;font-weight:600}
.td-link:hover{text-decoration:underline}

/* ── TABS ── */
.tabs{display:flex;border-bottom:2px solid var(--border);margin-bottom:20px;gap:0;overflow-x:auto}
.tab{padding:10px 18px;cursor:pointer;font-size:13px;font-weight:600;color:var(--text-s);border-bottom:2px solid transparent;margin-bottom:-2px;white-space:nowrap;transition:all .2s}
.tab:hover{color:var(--text)}
.tab.active{color:var(--accent);border-bottom-color:var(--accent)}

/* ── TIMELINE ── */
.timeline{position:relative;padding-left:28px}
.timeline::before{content:'';position:absolute;left:10px;top:0;bottom:0;width:2px;background:var(--border)}
.tl-item{position:relative;margin-bottom:20px}
.tl-dot{position:absolute;left:-23px;width:20px;height:20px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;border:2px solid var(--card);z-index:1;top:2px}
.tl-dot.done{background:var(--success);color:#fff}
.tl-dot.active{background:var(--accent);color:#fff;box-shadow:0 0 0 4px rgba(37,99,235,.2)}
.tl-dot.pending{background:#fff;border-color:var(--border);color:var(--text-m)}
.tl-dot.delayed{background:var(--danger);color:#fff}
.tl-content{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:12px 14px;cursor:pointer;transition:all .2s}
.tl-content:hover{border-color:var(--accent-l);box-shadow:var(--shadow)}
.tl-content h4{font-size:13px;font-weight:700;margin-bottom:4px}
.tl-content .tl-meta{display:flex;gap:12px;font-size:11px;color:var(--text-s);flex-wrap:wrap}

/* ── KANBAN ── */
.kanban-board{display:flex;gap:14px;overflow-x:auto;padding-bottom:16px;min-height:calc(100vh - 140px)}
.kanban-col{flex-shrink:0;width:250px}
.kanban-col-header{padding:10px 12px;border-radius:var(--radius) var(--radius) 0 0;display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.kanban-col-header h3{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.5px}
.kanban-col-header .kcnt{font-size:11px;font-weight:700;padding:2px 7px;border-radius:10px;background:rgba(0,0,0,.15);color:#fff}
.kanban-card{background:var(--card);border-radius:var(--radius);padding:12px;box-shadow:var(--shadow);cursor:pointer;margin-bottom:8px;border:1px solid var(--border);transition:all .2s}
.kanban-card:hover{transform:translateY(-1px);box-shadow:var(--shadow-md)}
.kc-number{font-size:12px;font-weight:700;color:var(--primary);margin-bottom:4px}
.kc-customer{font-size:13px;font-weight:600;margin-bottom:2px}
.kc-job{font-size:11px;color:var(--text-s);margin-bottom:8px}
.kc-qty{display:flex;gap:8px;margin-bottom:8px}
.kc-qty-item{flex:1;text-align:center;padding:4px;background:var(--bg);border-radius:4px}
.kc-qty-item .v{font-size:14px;font-weight:700}
.kc-qty-item .l{font-size:10px;color:var(--text-s)}
.kc-footer{display:flex;align-items:center;justify-content:space-between;font-size:11px;color:var(--text-m)}

/* ── FORMS ── */
.form-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:16px}
.form-group{display:flex;flex-direction:column;gap:6px}
.form-group label{font-size:12px;font-weight:600;color:var(--text-s);text-transform:uppercase;letter-spacing:.5px}
.form-group input,.form-group select,.form-group textarea{padding:9px 12px;border:1.5px solid var(--border);border-radius:var(--radius);background:#f8fafc;transition:all .2s;color:var(--text)}
.form-group input:focus,.form-group select:focus,.form-group textarea:focus{border-color:var(--accent);background:#fff;box-shadow:0 0 0 3px rgba(37,99,235,.08)}
.form-group textarea{resize:vertical;min-height:80px}
.form-section{margin-bottom:24px}
.form-section h3{font-size:13px;font-weight:700;color:var(--text-s);text-transform:uppercase;letter-spacing:.5px;margin-bottom:14px;padding-bottom:8px;border-bottom:1px solid var(--border)}

/* ── FILE UPLOAD ── */
.upload-zone{border:2px dashed var(--border);border-radius:var(--radius-lg);padding:24px;text-align:center;cursor:pointer;transition:all .2s;background:#fafbfc}
.upload-zone:hover{border-color:var(--accent);background:#f0f7ff}
.upload-zone .uz-icon{font-size:32px;margin-bottom:8px}
.upload-zone p{font-size:13px;color:var(--text-s)}
.upload-zone span{font-size:11px;color:var(--text-m)}
.file-list{margin-top:12px;display:flex;flex-direction:column;gap:6px}
.file-item{display:flex;align-items:center;gap:10px;padding:8px 12px;background:#f8fafc;border-radius:var(--radius);border:1px solid var(--border)}
.file-item .fi-icon{font-size:18px}
.file-item .fi-name{flex:1;font-size:13px;font-weight:500}
.file-item .fi-size{font-size:11px;color:var(--text-m)}
.file-item .fi-actions{display:flex;gap:4px}

/* ── MODAL ── */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:500;display:flex;align-items:center;justify-content:center;padding:20px;backdrop-filter:blur(2px)}
.modal{background:var(--card);border-radius:var(--radius-lg);width:100%;max-width:560px;max-height:90vh;overflow-y:auto;box-shadow:var(--shadow-lg)}
.modal-lg{max-width:780px}
.modal-header{padding:20px 24px 0;display:flex;align-items:center;justify-content:space-between}
.modal-header h2{font-size:18px;font-weight:700}
.btn-close{background:none;font-size:20px;color:var(--text-s);padding:4px;border-radius:var(--radius)}
.btn-close:hover{background:var(--bg);color:var(--text)}
.modal-body{padding:20px 24px}
.modal-footer{padding:0 24px 20px;display:flex;gap:10px;justify-content:flex-end}

/* ── NOTIFICATIONS ── */
.notif-panel{position:fixed;top:var(--th);right:0;width:380px;height:calc(100vh - var(--th));background:var(--card);border-left:1px solid var(--border);z-index:300;box-shadow:var(--shadow-lg);display:none;flex-direction:column;overflow:hidden}
.notif-panel.open{display:flex}
.notif-header{padding:16px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.notif-header h3{font-size:15px;font-weight:700}
.notif-list{flex:1;overflow-y:auto;padding:8px}
.notif-item{padding:12px;border-radius:var(--radius);cursor:pointer;transition:all .2s;border:1px solid transparent;margin-bottom:4px}
.notif-item:hover{background:var(--bg)}
.notif-item.unread{background:#eff6ff;border-color:#bfdbfe}
.notif-item .ni-header{display:flex;align-items:center;gap:8px;margin-bottom:4px}
.notif-item .ni-icon{font-size:18px}
.notif-item .ni-title{font-size:13px;font-weight:700;flex:1}
.notif-item .ni-time{font-size:11px;color:var(--text-m)}
.notif-item .ni-body{font-size:12px;color:var(--text-s)}
.notif-item .ni-order{font-size:12px;color:var(--accent);font-weight:600;margin-top:3px}

/* ── ACTIVITY LOG ── */
.activity-list{display:flex;flex-direction:column;gap:0}
.activity-item{display:flex;gap:12px;padding:10px 0;border-bottom:1px solid var(--border)}
.activity-item:last-child{border-bottom:none}
.ai-dot{width:8px;height:8px;border-radius:50%;background:var(--accent);flex-shrink:0;margin-top:6px}
.ai-content{flex:1}
.ai-text{font-size:13px;color:var(--text)}
.ai-text strong{color:var(--primary)}
.ai-meta{font-size:11px;color:var(--text-m);margin-top:2px}

/* ── WORKFLOW BUILDER ── */
.wf-stage{display:flex;align-items:center;gap:12px;padding:12px 16px;background:var(--card);border:1.5px solid var(--border);border-radius:var(--radius);margin-bottom:8px;cursor:grab}
.wf-stage:hover{border-color:var(--accent-l);box-shadow:var(--shadow)}
.wf-stage .ws-num{width:28px;height:28px;border-radius:50%;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;flex-shrink:0}
.wf-stage .ws-name{flex:1;font-size:13px;font-weight:600}
.wf-stage .ws-dept{font-size:11px;color:var(--text-s)}
.wf-arrow{text-align:center;color:var(--text-m);font-size:16px;margin:2px 0 2px 28px}

/* ── CHECKLIST ── */
.checklist{display:flex;flex-direction:column;gap:6px}
.checklist-item{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:var(--radius);cursor:pointer;transition:all .2s}
.checklist-item:hover{background:var(--bg)}
.checklist-item input[type=checkbox]{width:16px;height:16px;accent-color:var(--success)}
.checklist-item label{font-size:13px;cursor:pointer;flex:1}
.checklist-item.checked label{text-decoration:line-through;color:var(--text-m)}

/* ── DOCUMENT CARDS ── */
.doc-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
.doc-card{background:var(--bg);border:1px solid var(--border);border-radius:var(--radius);padding:14px;text-align:center;cursor:pointer;transition:all .2s}
.doc-card:hover{border-color:var(--accent);background:#f0f7ff;transform:translateY(-1px)}
.doc-card .dc-icon{font-size:32px;margin-bottom:8px}
.doc-card .dc-name{font-size:12px;font-weight:600;color:var(--text);word-break:break-all}
.doc-card .dc-meta{font-size:10px;color:var(--text-m);margin-top:3px}
.doc-card .dc-actions{display:flex;justify-content:center;gap:4px;margin-top:8px;opacity:0;transition:opacity .2s}
.doc-card:hover .dc-actions{opacity:1}

/* ── SECTION HEADER ── */
.section-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;flex-wrap:wrap;gap:10px}
.section-header h1{font-size:22px;font-weight:800;color:var(--text)}
.section-header p{font-size:13px;color:var(--text-s);margin-top:2px}
.section-actions{display:flex;gap:10px;flex-wrap:wrap}

/* ── EMPTY STATE ── */
.empty-state{text-align:center;padding:60px 20px;color:var(--text-s)}
.empty-state .es-icon{font-size:48px;margin-bottom:12px;opacity:.4}
.empty-state h3{font-size:16px;font-weight:700;margin-bottom:6px}
.empty-state p{font-size:13px}

/* ── DETAIL HEADER ── */
.detail-header{background:var(--card);border-radius:var(--radius-lg);padding:24px;margin-bottom:20px;box-shadow:var(--shadow)}
.dh-top{display:flex;align-items:flex-start;justify-content:space-between;flex-wrap:wrap;gap:16px;margin-bottom:16px}
.dh-number{font-size:24px;font-weight:900;color:var(--primary)}
.dh-customer{font-size:16px;font-weight:700;margin-top:2px}
.dh-job{font-size:14px;color:var(--text-s)}
.dh-badges{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.dh-actions{display:flex;gap:8px;flex-wrap:wrap}
.dh-metrics{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:14px;padding-top:16px;border-top:1px solid var(--border)}
.dh-metric{padding:12px;background:var(--bg);border-radius:var(--radius)}
.dh-metric .dm-label{font-size:11px;font-weight:600;color:var(--text-s);text-transform:uppercase;letter-spacing:.5px}
.dh-metric .dm-value{font-size:18px;font-weight:800;margin-top:4px}
.dh-metric .dm-sub{font-size:11px;color:var(--text-m);margin-top:2px}

/* ── SPECIFIC PAGE STYLES ── */
.dashboard-welcome{background:linear-gradient(135deg,var(--primary-d),var(--primary));color:#fff;border-radius:var(--radius-lg);padding:20px 24px;margin-bottom:20px;display:flex;align-items:center;justify-content:space-between}
.dashboard-welcome h2{font-size:20px;font-weight:800}
.dashboard-welcome p{font-size:13px;opacity:.8;margin-top:4px}
.dashboard-welcome .dw-right{text-align:right;opacity:.7;font-size:13px}

.section-sep{height:1px;background:var(--border);margin:20px 0}

.two-col{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.three-col{display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px}

.info-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.info-item .ii-label{font-size:11px;font-weight:600;color:var(--text-s);text-transform:uppercase;letter-spacing:.5px}
.info-item .ii-value{font-size:14px;font-weight:600;color:var(--text);margin-top:2px}

/* ── STAGE BUTTONS ── */
.stage-action-card{background:linear-gradient(135deg,#f0f7ff,#e0eeff);border:2px solid #bfdbfe;border-radius:var(--radius-lg);padding:24px;text-align:center;margin-bottom:20px}
.stage-action-card h3{font-size:16px;font-weight:700;color:var(--primary);margin-bottom:6px}
.stage-action-card p{font-size:13px;color:var(--text-s);margin-bottom:16px}

/* ── EMPLOYEE CARD ── */
.emp-card{background:var(--card);border-radius:var(--radius-lg);padding:16px;box-shadow:var(--shadow);display:flex;align-items:center;gap:14px;border:1px solid var(--border);transition:all .2s;cursor:pointer}
.emp-card:hover{transform:translateY(-1px);box-shadow:var(--shadow-md);border-color:var(--accent-l)}
.emp-avatar{width:46px;height:46px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:700;color:#fff;flex-shrink:0}
.emp-info h4{font-size:14px;font-weight:700}
.emp-info p{font-size:12px;color:var(--text-s)}
.emp-info span{font-size:11px;color:var(--text-m)}

/* ── REPORT ── */
.report-filter-bar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:20px;padding:14px;background:var(--card);border-radius:var(--radius-lg);box-shadow:var(--shadow)}
.report-filter-bar select,.report-filter-bar input{padding:7px 10px;border:1.5px solid var(--border);border-radius:var(--radius);background:#f8fafc;font-size:13px}
.chart-placeholder{background:linear-gradient(135deg,#f8fafc,#f1f5f9);border:2px dashed var(--border);border-radius:var(--radius-lg);padding:40px;text-align:center;color:var(--text-m)}

/* ── RESPONSIVE ── */
@media(max-width:768px){
  #sidebar{position:fixed;left:0;top:0;bottom:0;z-index:200;transform:translateX(-100%);transition:transform .3s}
  #sidebar.mobile-open{transform:translateX(0)}
  #page-content{padding:16px}
  .stats-grid{grid-template-columns:repeat(2,1fr)}
  .orders-grid{grid-template-columns:1fr}
  .two-col,.three-col{grid-template-columns:1fr}
  .search-box input{width:150px}
  .search-box input:focus{width:180px}
  .dh-top{flex-direction:column}
  .modal{margin:16px}
}
@media(max-width:480px){
  .stats-grid{grid-template-columns:1fr 1fr}
  .page-title{font-size:15px}
}

/* ── UTILITY ── */
.flex{display:flex}.flex-col{flex-direction:column}.items-center{align-items:center}.justify-between{justify-content:space-between}.gap-2{gap:8px}.gap-3{gap:12px}.gap-4{gap:16px}
.mt-1{margin-top:4px}.mt-2{margin-top:8px}.mt-3{margin-top:12px}.mt-4{margin-top:16px}
.mb-2{margin-bottom:8px}.mb-3{margin-bottom:12px}.mb-4{margin-bottom:16px}
.text-sm{font-size:12px}.text-xs{font-size:11px}.text-lg{font-size:16px}.text-xl{font-size:18px}
.font-bold{font-weight:700}.font-semibold{font-weight:600}
.text-muted{color:var(--text-m)}.text-secondary{color:var(--text-s)}
.truncate{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hidden{display:none!important}
.full-width{width:100%}
.text-center{text-align:center}
.text-right{text-align:right}
.rounded{border-radius:var(--radius)}
.shadow{box-shadow:var(--shadow)}

/* Status dot */
.status-dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px}
.status-dot.green{background:var(--success)}
.status-dot.blue{background:var(--accent)}
.status-dot.orange{background:var(--warning)}
.status-dot.red{background:var(--danger)}
.status-dot.gray{background:var(--text-m)}

.chip{display:inline-flex;align-items:center;gap:4px;padding:4px 10px;border-radius:20px;font-size:12px;font-weight:600;background:var(--bg);border:1px solid var(--border);color:var(--text-s)}
</style>
</head>

function doLogin(){
  const email = document.getElementById('login-email').value.trim();
  const pass  = document.getElementById('login-pass').value.trim();
  const emp = DB.employees.find(e=>e.email===email && e.pass===pass);
  if(!emp){ alert('Invalid credentials. Please check your email and password.'); return; }
  STATE.user = emp;
  document.getElementById('login-screen').style.display='none';
  document.getElementById('app').style.display='flex';
  document.getElementById('app').classList.add('active');
  setupUserUI();
  renderSidebar();
  navigate('dashboard');
}

function doLogout(){
  STATE.user = null;
  document.getElementById('login-screen').style.display='flex';
  document.getElementById('app').style.display='none';
  document.getElementById('app').classList.remove('active');
}

function setupUserUI(){
  const u = STATE.user;
  const initials = u.name.split(' ').map(x=>x[0]).join('').slice(0,2);
  document.getElementById('sb-avatar').textContent = initials;
  document.getElementById('sb-avatar').style.background = u.color;
  document.getElementById('sb-user-info').innerHTML = `<p>${u.name}</p><span>${u.designation}</span>`;
  document.getElementById('topbar-avatar').textContent = initials;
  document.getElementById('topbar-avatar').style.background = u.color;
  document.getElementById('topbar-user-info').innerHTML = `<p>${u.name}</p><span>${u.role}</span>`;
  renderNotifications();
}

function renderSidebar(){
  let html='';
  for(const item of NAV_ITEMS){
    if(item.section){html+=`<div class="nav-section">${STATE.sidebarOpen?item.section:''}</div>`;continue;}
    const active=STATE.page===item.id?'active':'';
    html+=`<div class="nav-item ${active}" onclick="navigate('${item.id}')">
      <span class="nav-icon">${item.icon}</span>
      <span class="nav-label">${item.label}</span>
      ${item.badge?`<span class="nav-badge">${item.badge}</span>`:''}
    </div>`;
  }
  document.getElementById('sidebar-nav').innerHTML=html;

function getCustomer(id){return DB.customers.find(c=>c.id===id)||{name:'Unknown',contact:'–'};}
function getOrder(id){return DB.orders.find(o=>o.id===id);}
function getEmployee(name){return DB.employees.find(e=>e.name===name);}
function calcProgress(completed,total){return total>0?Math.round(completed/total*100):0;}
function progressBar(completed,total){
  const pct=calcProgress(completed,total);
  const color=pct>=100?'green':pct>=70?'blue':pct>=40?'orange':'red';
  const blocks=Math.round(pct/5);
  const filled='█'.repeat(blocks);
  const empty='░'.repeat(20-blocks);
  return {pct,color,filled,empty};
}
function statusBadge(status){
  const map={
    'ACTIVE':'badge-primary','DELAYED':'badge-danger','COMPLETED':'badge-success',
    'PENDING':'badge-gray','READY':'badge-success','DISPATCHED':'badge-dark',
    'Accepted':'badge-success','Rejected':'badge-danger','Pending':'badge-warning',
    'NEW':'badge-info','IN PROGRESS':'badge-primary','OVERDUE':'badge-danger',
    'DONE':'badge-success','Received':'badge-success','Ordered':'badge-primary',
    'Required':'badge-warning','Purchase Pending':'badge-warning'
  };
  return `<span class="badge ${map[status]||'badge-gray'}">${status}</span>`;
}
function priorityBadge(p){
  const map={URGENT:'badge-danger',HIGH:'badge-warning',NORMAL:'badge-primary',LOW:'badge-gray'};
  const icons={URGENT:'🔴',HIGH:'🟠',NORMAL:'🔵',LOW:'⚪'};
  return `<span class="badge ${map[p]||'badge-gray'}">${icons[p]||''}${p}</span>`;
}
function stageIcon(status){
  if(status==='DONE')return '<span style="color:var(--success)">✓</span>';
  if(status==='ACTIVE')return '<span style="color:var(--accent)">🔵</span>';
  if(status==='DELAYED')return '<span style="color:var(--danger)">🔴</span>';
  return '<span style="color:var(--text-m)">○</span>';
}
function stageDotClass(status){
  if(status==='DONE')return 'done';
  if(status==='ACTIVE')return 'active';
  if(status==='DELAYED')return 'delayed';
  return 'pending';
}
function fmt(dateStr){
  if(!dateStr)return '–';
  try{
    const d=new Date(dateStr.split(' ')[0]);
    return d.toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric'});
  }catch{return dateStr;}
}
function fmtDT(dateStr){
  if(!dateStr)return '–';
  const parts=dateStr.split(' ');
  if(parts.length<2)return fmt(dateStr);
  try{
    const d=new Date(parts[0]);
    return d.toLocaleDateString('en-IN',{day:'2-digit',month:'short'})+' '+parts[1];
  }catch{return dateStr;}
}
function fileIcon(type){
  const map={pdf:'📄',step:'📐',stp:'📐',dwg:'📐',dxf:'📐',jpg:'🖼️',png:'🖼️',xlsx:'📊',docx:'📝',zip:'🗜️',cad:'📐'};
  return map[type?.toLowerCase()]||'📎';
}

function acceptQuotation(qId){
  const q=DB.quotations.find(x=>x.id===qId);
  if(!q)return;
  if(confirm(`Accept Quotation ${qId} and create Order?\n\nCustomer: ${getCustomer(q.customerId).name}\nAmount: ₹${(q.amount||0).toLocaleString('en-IN')}`)){
    q.status='Accepted';
    alert(`✅ Quotation Accepted!\n\nOrder RSI-2026-00${DB.orders.length+1} will be created automatically.\n\n→ Navigate to Orders to view the new job card.`);
    navigate('quotations');
  }
}

function setOrderTab(i){
  STATE.activeOrderTab=i;
  const o=getOrder(STATE.params.id)||DB.orders[0];
  const c=getCustomer(o.customerId);
  const p=progressBar(o.completedQty,o.totalQty);
  const remaining=o.totalQty-o.completedQty;
  const tabs=['Overview','Workflow','Tasks','Documents','Material','Design','QC','Dispatch','Activity'];
  const tabsHtml=tabs.map((t,idx)=>`<div class="tab ${idx===i?'active':''}" onclick="setOrderTab(${idx})">${t}</div>`).join('');
  let content='';
  if(i===0)content=renderOrderOverview(o,c,p,remaining);
  else if(i===1)content=renderOrderWorkflow(o);
  else if(i===2)content=renderOrderTasks(o);
  else if(i===3)content=renderOrderDocuments(o);
  else if(i===4)content=renderOrderMaterial(o);
  else if(i===5)content=renderOrderDesign(o);
  else if(i===6)content=renderOrderQC(o);
  else if(i===7)content=renderOrderDispatch(o);
  else if(i===8)content=renderOrderActivity(o);
  const cardEl=document.querySelector('#page-content .card');
  if(cardEl)cardEl.innerHTML=`<div class="tabs">${tabsHtml}</div>${content}`;
}

function renderKanban(){
  const columns=[
    {key:'ORDER RECEIVED',color:'#1e3a5f',label:'Order Received'},
    {key:'MATERIAL',color:'#7c3aed',label:'Material'},
    {key:'DESIGN',color:'#0891b2',label:'Design'},
    {key:'MACHINING',color:'#2563eb',label:'Machining'},
    {key:'FITTING',color:'#d97706',label:'Fitting / Assembly'},
    {key:'QC',color:'#16a34a',label:'Quality Check'},
    {key:'READY TO DISPATCH',color:'#059669',label:'Ready to Dispatch'},
    {key:'DISPATCHED',color:'#1e293b',label:'Dispatched'},
    {key:'COMPLETED',color:'#16a34a',label:'Completed'}
  ];

  let kanbanHtml='';
  for(const col of columns){
    const colOrders=DB.orders.filter(o=>{
      if(col.key==='COMPLETED')return o.status==='COMPLETED';
      if(col.key==='ORDER RECEIVED')return o.stages&&o.stages[0]&&o.stages[0].status==='ACTIVE';
      return o.currentStage===col.key;
    });
    let cardsHtml='';
    for(const o of colOrders){
      const c=getCustomer(o.customerId);
      const p=progressBar(o.completedQty,o.totalQty);
      const rem=o.totalQty-o.completedQty;
      cardsHtml+=`<div class="kanban-card" onclick="navigate('order-detail',{id:'${o.id}'})">
        <div class="kc-number">${o.id} ${o.status==='DELAYED'?'🔴':''}</div>
        <div class="kc-customer">${c.name}</div>
        <div class="kc-job">${o.jobDescription.slice(0,40)}…</div>
        <div class="kc-qty">
          <div class="kc-qty-item"><div class="v" style="color:var(--success)">${o.completedQty}/${o.totalQty}</div><div class="l">Done</div></div>
          <div class="kc-qty-item"><div class="v" style="color:var(--warning)">${rem}</div><div class="l">Left</div></div>
        </div>
        <div class="progress-bar"><div class="progress-fill ${p.color}" style="width:${p.pct}%"></div></div>
        <div class="kc-footer" style="margin-top:6px">
          <span>👤 ${o.assignedTo.split(' ')[0]}</span>
          ${priorityBadge(o.priority)}
          <span>${fmt(o.targetDate)}</span>
        </div>
      </div>`;
    }
    kanbanHtml+=`
    <div class="kanban-col">
      <div class="kanban-col-header" style="background:${col.color}">
        <h3 style="color:#fff">${col.label}</h3>
        <span class="kcnt">${colOrders.length}</span>
      </div>
      ${cardsHtml||`<div style="padding:16px;text-align:center;font-size:12px;color:var(--text-m);background:var(--card);border-radius:var(--radius);border:1px dashed var(--border)">No orders</div>`}
    </div>`;
  }

  return `
  <div class="section-header">
    <div><h1>📌 Production Board</h1><p>Visual Kanban — factory flow at a glance</p></div>
    <div class="section-actions">
      <button class="btn btn-outline" onclick="navigate('orders')">📋 List View</button>
      <button class="btn btn-primary">+ New Order</button>
    </div>
  </div>
  <div class="kanban-board">${kanbanHtml}</div>`;
}

        </div>
      </div>
      <div class="progress-bar" style="height:10px;margin-bottom:6px"><div class="progress-fill ${p.color}" style="width:${p.pct}%"></div></div>
      <div style="display:flex;justify-content:space-between;font-size:13px;margin-bottom:16px">

function renderTasks(){

function saveProfile(){
  const name=document.getElementById('profile-name').value.trim();
  const email=document.getElementById('profile-email').value.trim();
  const phone=document.getElementById('profile-phone').value.trim();
  const pass=document.getElementById('profile-pass').value.trim();
  if(!name||!email){alert('Name and Email are required!');return;}
  const emp=DB.employees.find(e=>e.id===STATE.user.id);
  if(emp){
    emp.name=name;emp.email=email;emp.phone=phone;
    if(pass)emp.pass=pass;
  }
  STATE.user.name=name;STATE.user.email=email;STATE.user.phone=phone;
  updateUserUI();
  DB.activities.unshift({time:'Just now',by:name,action:'Updated profile',order:''});
  alert('✅ Profile updated successfully!');
  renderPage();
}

function myNotifications(){
  // show notifications addressed to this user, or global ones (no forUser set)
  return DB.notifications.filter(n=>!n.forUser||n.forUser===STATE.user.name);
}

function updateNotifBadge(){
  const unread=myNotifications().filter(n=>!n.read).length;
  document.getElementById('notif-count').textContent=unread||'';
  document.getElementById('notif-panel-count').textContent=unread||'0';
}

function renderNotifications(){
  updateNotifBadge();
  let html='';
  for(const n of myNotifications()){
    html+=`<div class="notif-item ${n.read?'':'unread'}" onclick="openNotif('${n.id}')">
      <div class="ni-header">
        <span class="ni-icon">${n.icon}</span>
        <span class="ni-title">${n.title}</span>
        <span class="ni-time">${n.time}</span>
      </div>
      <div class="ni-body">${n.body}</div>
      ${n.order?`<div class="ni-order">📦 ${n.order}</div>`:''}
    </div>`;
  }
  document.getElementById('notif-list').innerHTML=html||'<div style="padding:20px;text-align:center;color:var(--text-m)">No notifications</div>';
}

function toggleNotifPanel(){
  STATE.notifPanelOpen=!STATE.notifPanelOpen;
  document.getElementById('notif-panel').classList.toggle('open',STATE.notifPanelOpen);
}

function markAllRead(){
  myNotifications().forEach(n=>n.read=true);
  renderNotifications();
  if(STATE.page==='notifications')renderPage();
}

function openNotif(id){
  const n=DB.notifications.find(x=>x.id===id);
  if(n){n.read=true;renderNotifications();}
  if(n&&n.order){STATE.notifPanelOpen=false;document.getElementById('notif-panel').classList.remove('open');navigate('order-detail',{id:n.order});}
}

        <div class="form-group"><label>Role</label><select id="emp-role"><option value="ADMIN">Admin</option><option value="MACHINING">Machining</option><option value="DESIGN">Design</option><option value="FITTING">Fitting</option><option value="QC">QC</option><option value="DISPATCH">Dispatch</option><option value="SALES">Sales</option></select></div>
        <div class="form-group"><label>Phone</label><input id="emp-phone" placeholder="9800000002" type="tel"></div>
        <div class="form-group"><label>Email (Login ID)</label><input id="emp-email" type="email" placeholder="suresh@rsi.com"></div>
        <div class="form-group"><label>Password</label><input id="emp-pass" type="password" placeholder="Set login password"></div>
        <div class="form-group"><label>Status</label><select id="emp-active"><option value="true">Active</option><option value="false">Inactive</option></select></div>
      </div>`;
      break;
    case 'edit-employee':
      const ee=DB.employees.find(x=>x.id===STATE.editEmpId);
      if(!ee){alert('Employee not found');return;}
      title=`Edit Employee — ${ee.name}`;
      body=`<div class="form-grid">
        <div class="form-group"><label>Full Name</label><input id="emp-name" value="${ee.name}"></div>
        <div class="form-group"><label>Department</label><select id="emp-dept">
          ${['Admin','Machining','Design','Fitting','QC','Dispatch / Store','Sales'].map(d=>`<option${d===ee.dept?' selected':''}>${d}</option>`).join('')}
        </select></div>
        <div class="form-group"><label>Designation</label><input id="emp-desig" value="${ee.designation}"></div>
        <div class="form-group"><label>Role</label><select id="emp-role">
          ${['ADMIN','MACHINING','DESIGN','FITTING','QC','DISPATCH','SALES'].map(r=>`<option value="${r}"${r===ee.role?' selected':''}>${r}</option>`).join('')}
        </select></div>
        <div class="form-group"><label>Phone</label><input id="emp-phone" type="tel" value="${ee.phone||''}"></div>
        <div class="form-group"><label>Email (Login ID)</label><input id="emp-email" type="email" value="${ee.email}"></div>
        <div class="form-group"><label>New Password <span style="font-size:11px;color:var(--text-m)">(leave blank to keep current)</span></label><input id="emp-pass" type="password" placeholder="Enter new password"></div>
        <div class="form-group"><label>Status</label><select id="emp-active">
          <option value="true"${ee.active?' selected':''}>Active</option>
          <option value="false"${!ee.active?' selected':''}>Inactive</option>
        </select></div>
      </div>`;
      break;
    case 'new-enquiry':
      title='New Customer Enquiry';
      body=`<div class="form-grid">
        <div class="form-group"><label>Customer</label><select>${DB.customers.map(c=>`<option value="${c.id}">${c.name}</option>`).join('')}</select></div>
        <div class="form-group"><label>Requirement Type</label><select><option>Mould</option><option>Job Work</option><option>Production</option><option>Machining</option><option>Fitting</option><option>Assembly</option><option>Other</option></select></div>
        <div class="form-group"><label>Total Quantity</label><input type="number" placeholder="20"></div>
        <div class="form-group"><label>Priority</label><select><option>URGENT</option><option>HIGH</option><option>NORMAL</option><option>LOW</option></select></div>
        <div class="form-group"><label>Expected Delivery Date</label><input type="date"></div>
        <div class="form-group"><label>Drawing / Reference No</label><input placeholder="DRG-006"></div>
      </div>
      <div class="form-group mt-3"><label>Requirement Description</label><textarea placeholder="Describe the customer's requirement in detail..."></textarea></div>
      <div class="form-group mt-3"><label>Material Requirement</label><input placeholder="P20 Steel, Al 6061, etc."></div>
      <div class="upload-zone mt-3"><div class="uz-icon">📎</div><p>Upload customer files</p><span>PDF, DWG, DXF, STEP, STP, JPG, PNG, Excel, ZIP accepted</span></div>`;
      break;
  }
  const modal=document.createElement('div');
  modal.className='modal-overlay';
  modal.id='modal-overlay';
  modal.innerHTML=`<div class="modal modal-lg">
    <div class="modal-header">
      <h2>${title}</h2>
      <button class="btn-close" onclick="closeModal()">✕</button>
    </div>
    <div class="modal-body">${body}</div>
    <div class="modal-footer">
      <button class="btn btn-outline" onclick="closeModal()">Cancel</button>
      <button class="btn btn-primary" onclick="saveModal('${type}')">💾 Save</button>
    </div>
  </div>`;
  document.body.appendChild(modal);
}

function showUpdateQtyModal(orderId){
  STATE.modalOrderId=orderId;
  showModal('update-qty');
}

function previewQty(total,val,orderId){
  const completed=parseInt(val)||0;
  const rem=total-completed;
  const pct=calcProgress(completed,total);
  const el=document.getElementById('qty-preview');
  if(el)el.textContent=`Completed: ${completed} / ${total} | Remaining: ${rem} | Progress: ${pct}%`;
}

function closeModal(){
  const m=document.getElementById('modal-overlay');
  if(m)m.remove();
}

function saveModal(type){
  if(type==='update-qty'){
    const o=getOrder(STATE.modalOrderId)||DB.orders[0];
    const inp=document.getElementById('new-qty-input');
    if(inp){
      const newVal=parseInt(inp.value)||0;
      if(newVal<0||newVal>o.totalQty){alert('Invalid quantity!');return;}
      o.completedQty=newVal;
      DB.activities.unshift({time:'Just now',by:STATE.user.name,action:`Updated Completed Qty to ${newVal} for ${o.id}`,order:o.id});
      closeModal();
      if(STATE.page==='order-detail')renderPage();
      else if(STATE.page==='dashboard')renderPage();
    }
    return;
  }
  if(type==='new-task'){
    const taskTitle=document.getElementById('task-title').value.trim();
    if(!taskTitle){alert('Task title is required!');return;}
    const assignToId=document.getElementById('task-assign').value;
    const assignedEmp=DB.employees.find(e=>e.id===assignToId);
    const newTask={
      id:'TASK-'+(DB.tasks.length+1).toString().padStart(3,'0'),
      title:taskTitle,
      desc:document.getElementById('task-desc').value,
      orderId:document.getElementById('task-order').value,
      assignedTo:assignedEmp?assignedEmp.name:STATE.user.name,
      assignedBy:STATE.user.name,
      priority:document.getElementById('task-priority').value,
      status:'NEW',
      dueDate:document.getElementById('task-date').value,
      dueTime:document.getElementById('task-time').value||'17:00',
      comments:[]
    };
    DB.tasks.push(newTask);
    DB.activities.unshift({time:'Just now',by:STATE.user.name,action:`Assigned task "${taskTitle}" to ${newTask.assignedTo}`,order:newTask.orderId});
    DB.notifications.unshift({
      id:'NOTIF-'+Date.now(),
      icon:'📝',
      title:`New Task Assigned: ${taskTitle}`,
      body:`${STATE.user.name} has assigned you a task. Priority: ${newTask.priority}. Due: ${newTask.dueDate||'Not set'}.`,
      order:newTask.orderId,
      forUser:newTask.assignedTo,
      time:'Just now',
      read:false
    });
    updateNotifBadge();
    closeModal();
    navigate('tasks');
    return;
  }
  if(type==='edit-employee'){
    if(STATE.user.role!=='ADMIN'){closeModal();return;}
    const ee=DB.employees.find(x=>x.id===STATE.editEmpId);
    if(!ee){closeModal();return;}
    const name=document.getElementById('emp-name').value.trim();
    const email=document.getElementById('emp-email').value.trim();
    if(!name||!email){alert('Name and Email are required!');return;}
    ee.name=name;
    ee.dept=document.getElementById('emp-dept').value;
    ee.designation=document.getElementById('emp-desig').value;
    ee.role=document.getElementById('emp-role').value;
    ee.phone=document.getElementById('emp-phone').value;
    ee.email=email;
    const newPass=document.getElementById('emp-pass').value.trim();
    if(newPass) ee.pass=newPass;
    ee.active=document.getElementById('emp-active').value==='true';
    DB.activities.unshift({time:'Just now',by:STATE.user.name,action:`Updated employee: ${name}`,order:''});
    closeModal();
    navigate('employees');
    return;
  }
  if(type==='new-employee'){
    if(STATE.user.role!=='ADMIN'){closeModal();return;}
    const name=document.getElementById('emp-name').value.trim();
    const email=document.getElementById('emp-email').value.trim();
    const pass=document.getElementById('emp-pass').value.trim();
    if(!name||!email||!pass){alert('Name, Email and Password are required!');return;}
    const colors=['#2563eb','#7c3aed','#16a34a','#ea580c','#0891b2','#dc2626','#d97706'];
    const newEmp={
      id:'EMP-'+(DB.employees.length+1).toString().padStart(3,'0'),
      name,
      dept:document.getElementById('emp-dept').value,
      designation:document.getElementById('emp-desig').value,
      role:document.getElementById('emp-role').value,
      phone:document.getElementById('emp-phone').value,
      email,pass,
      skills:[],
      active:document.getElementById('emp-active').value==='true',
      color:colors[DB.employees.length%colors.length]
    };
    DB.employees.push(newEmp);
    DB.activities.unshift({time:'Just now',by:STATE.user.name,action:`Added new employee: ${name}`,order:''});
    closeModal();
    navigate('employees');
    return;
  }
  closeModal();
  alert('✅ Saved successfully!');
}

// ═══════════════════════════════════════════════════
// STAGE ACTIONS
// ═══════════════════════════════════════════════════
function completeStage(orderId,stageIdx){
  const o=getOrder(orderId);
  if(!o)return;
  const s=o.stages[stageIdx];
  if(!s)return;
  if(!confirm(`Mark "${s.name}" as COMPLETED?\n\nThe next stage will be automatically activated and the assigned person will be notified.`))return;
  s.status='DONE';
  s.end=new Date().toISOString().slice(0,10)+' '+new Date().toTimeString().slice(0,5);
  // Activate next stage
  if(stageIdx+1<o.stages.length){
    o.stages[stageIdx+1].status='ACTIVE';
    o.stages[stageIdx+1].start=s.end;
    o.currentStage=o.stages[stageIdx+1].name.toUpperCase();
    o.assignedTo=o.stages[stageIdx+1].person;
  } else {
    o.status='COMPLETED';
    o.currentStage='COMPLETED';
  }
  DB.activities.unshift({time:'Just now',by:STATE.user.name,action:`Completed stage "${s.name}" for ${orderId}`,order:orderId});
  alert(`✅ "${s.name}" marked COMPLETE!\n\n🔵 Next Stage: ${o.stages[stageIdx+1]?.name||'COMPLETED'}\n👤 Notified: ${o.stages[stageIdx+1]?.person||'–'}\n📊 Dashboard updated`);
  STATE.activeOrderTab=1;
  renderPage();
}

function toggleChecklist(stageIdx,checkIdx){
  const o=getOrder(STATE.params.id)||DB.orders[0];
  if(o&&o.stages[stageIdx]&&o.stages[stageIdx].checklist[checkIdx]){
    o.stages[stageIdx].checklist[checkIdx].done=!o.stages[stageIdx].checklist[checkIdx].done;
  }
}

// SEARCH
// ═══════════════════════════════════════════════════
function handleSearch(val){
  if(!val||val.length<2)return;
  const term=val.toLowerCase();
  // Search orders
  const matchOrders=DB.orders.filter(o=>o.id.toLowerCase().includes(term)||getCustomer(o.customerId).name.toLowerCase().includes(term)||o.jobDescription.toLowerCase().includes(term));
  if(matchOrders.length===1){navigate('order-detail',{id:matchOrders[0].id});}
}

function attachEvents(){
  // Close notif panel on outside click
  document.addEventListener('click',function(e){
    const panel=document.getElementById('notif-panel');
    const btn=document.querySelector('.btn-notif');
    if(panel&&!panel.contains(e.target)&&btn&&!btn.contains(e.target)){
      STATE.notifPanelOpen=false;
      panel.classList.remove('open');
    }
  },{once:true});
  // Enter key on login
  const passInput=document.getElementById('login-pass');
  if(passInput)passInput.onkeydown=e=>{if(e.key==='Enter')doLogin();};
}
